[project]
name = "semanticka-pretraga-materijala"
version = "0.1.0"
description = "Local semantic and TF-IDF search for PDF and TXT materials."
requires-python = ">=3.14,<3.15"
dependencies = [
    "filelock",
    "numpy",
    "psutil",
    "pypdf",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "streamlit",
    "torch",
]

[dependency-groups]
browser = [
    "playwright>=1.63.0",
]
dev = ["pytest"]
writing = [
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "microsoft-pypi"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
